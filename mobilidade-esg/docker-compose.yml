# ─────────────────────────────────────────────────────────────────────────────
# Orquestração: API + SQL Server
#  - Local:   docker compose up --build              (usa os defaults abaixo / .env)
#  - Staging: docker compose -p mobilidade-staging --env-file deploy/staging.env up -d
#  - Prod:    docker compose -p mobilidade-prod    --env-file deploy/production.env up -d
# Segredos (DB_PASSWORD, JWT_SECRET_KEY) vêm do .env local ou dos GitHub Secrets.
# ─────────────────────────────────────────────────────────────────────────────

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MSSQL_MEMORY_LIMIT_MB: ${DB_MEMORY_LIMIT_MB:-1024}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - mobilidade-net
    healthcheck:
      # Imagens 2022 recentes trazem o sqlcmd em /opt/mssql-tools18 (exige -C)
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    # No pipeline, API_IMAGE aponta para a imagem publicada no GHCR (ex.: ghcr.io/usuario/mobilidade-esg:<sha>)
    image: ${API_IMAGE:-mobilidade-esg:local}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      APP_VERSION: ${APP_VERSION:-local}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-MobilidadeESG};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env (mín. 32 caracteres)}
      JwtSettings__Issuer: MobilidadeESG
      JwtSettings__Audience: MobilidadeESGClients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - mobilidade-net
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  mobilidade-net:
    driver: bridge
