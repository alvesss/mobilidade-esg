# ─────────────────────────────────────────────────────────────────────────────
# Pipeline CI/CD — MobilidadeESG API
#
#  PR para main ........ build + testes + build da imagem (sem publicar)
#  push na main ........ build + testes → publica imagem no GHCR
#                        → deploy STAGING (automático) + smoke test
#                        → deploy PRODUÇÃO (exige aprovação no Environment) + smoke test
#
# Build/teste/imagem rodam em runners do GitHub (ubuntu-latest).
# Os deploys rodam em um runner self-hosted (máquina com Docker), que simula
# o servidor onde os ambientes de staging e produção ficam no ar.
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── 1. CI: build + testes ──────────────────────────────────────────────────
  build-test:
    name: Build & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MobilidadeESG.sln

      - name: Build
        run: dotnet build MobilidadeESG.sln --configuration Release --no-restore

      - name: Testes (xUnit)
        run: >
          dotnet test MobilidadeESG.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  # ── 2. Imagem Docker → GitHub Container Registry ───────────────────────────
  docker-image:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nome e tag da imagem
        id: vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${OWNER}/mobilidade-esg" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/mobilidade-esg:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy STAGING ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: self-hosted
    needs: docker-image
    if: github.event_name != 'pull_request'
    environment:
      name: staging
      url: http://localhost:8081
    concurrency: deploy-staging
    env:
      COMPOSE_PROJECT_NAME: mobilidade-staging
      API_IMAGE: ${{ needs.docker-image.outputs.image }}
      APP_VERSION: ${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem
        run: docker compose --env-file deploy/staging.env pull api

      - name: Subir ambiente
        run: docker compose --env-file deploy/staging.env up -d --no-build --remove-orphans

      - name: Smoke test (/health)
        run: docker run --rm --network mobilidade-staging_mobilidade-net curlimages/curl:8.10.1 -fsS --retry 30 --retry-delay 5 --retry-all-errors http://api:8080/health

      - name: Status dos containers
        if: always()
        run: docker compose --env-file deploy/staging.env ps

  # ── 4. Deploy PRODUÇÃO (com aprovação manual) ──────────────────────────────
  deploy-production:
    name: Deploy Produção
    runs-on: self-hosted
    needs: [docker-image, deploy-staging]
    if: github.event_name != 'pull_request'
    environment:
      name: production
      url: http://localhost:8080
    concurrency: deploy-production
    env:
      COMPOSE_PROJECT_NAME: mobilidade-prod
      API_IMAGE: ${{ needs.docker-image.outputs.image }}
      APP_VERSION: ${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar imagem (mesma validada em staging)
        run: docker compose --env-file deploy/production.env pull api

      - name: Subir ambiente
        run: docker compose --env-file deploy/production.env up -d --no-build --remove-orphans

      - name: Smoke test (/health)
        run: docker run --rm --network mobilidade-prod_mobilidade-net curlimages/curl:8.10.1 -fsS --retry 30 --retry-delay 5 --retry-all-errors http://api:8080/health

      - name: Status dos containers
        if: always()
        run: docker compose --env-file deploy/production.env ps
